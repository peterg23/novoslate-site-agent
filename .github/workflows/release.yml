name: Release

# Builds <repo-name>.zip and publishes a GitHub release whenever main has a version that hasn't been released yet.
# The tag (v<Version>) is created by the release step, so pushing a tag yourself is optional.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          MAIN=$(grep -l "Plugin Name:" ./*.php | head -1)
          VERSION=$(sed -n 's/^ *\* Version: *//p' "$MAIN" | head -1 | tr -d '[:space:]')
          CONST=$(grep -o "NSA_VERSION', '[^']*'" "$MAIN" | sed "s/.*', '//; s/'//")
          if [ -n "$CONST" ] && [ "$CONST" != "$VERSION" ]; then
            echo "Version: $VERSION does not match NSA_VERSION $CONST in $MAIN"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p "build/$SLUG"
          rsync -a --exclude-from=.distignore ./ "build/$SLUG/"
          cd build && zip -rq "$SLUG.zip" "$SLUG"

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          files: build/${{ github.event.repository.name }}.zip
          generate_release_notes: true
